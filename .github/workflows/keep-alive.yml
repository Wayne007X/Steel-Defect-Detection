name: Streamlit browser keep-alive

on:
  schedule:
    # UTC; Beijing time 00:17, 04:17, 08:17, 12:17, 16:17, 20:17.
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keep-alive.yml'
      - 'scripts/streamlit_keep_alive.py'

permissions:
  contents: read

concurrency:
  group: streamlit-keep-alive
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STREAMLIT_URL: https://steel-defect-detection-52wcl85z79gio5qv82slyd.streamlit.app/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Visit and verify the application
        run: python scripts/streamlit_keep_alive.py
      - name: Save browser screenshots and failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-browser-check
          path: keepalive-artifacts/
          retention-days: 7
          if-no-files-found: ignore
